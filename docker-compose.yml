version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: banking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: banking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: banking_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/banking_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=banking-ai-secret-key-production-ready-2026-tcs
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=1440
      - FRONTEND_URL=http://localhost:3000
      - DEMO_PASSWORD=BankDemo#2026
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

volumes:
  postgres_data:
  redis_data:
